[project]
name = "latte-graph-redis"
version = "2.0.0"
description = "Redis session state repository — typed async operations on latte session keyspace"
requires-python = ">=3.11"
dependencies = [
    "latte-graph-shared>=1.0.0",
    "redis[hiredis]>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "fakeredis[aioredis]>=2.20",
    "testcontainers[redis]>=4.0",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latte_graph_redis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=latte_graph_redis --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"

[tool.importlinter]
root_packages = ["latte_graph_redis"]

[[tool.importlinter.contracts]]
name = "Infrastructure must not import from interface"
type = "forbidden"
source_modules = ["latte_graph_redis.infrastructure"]
forbidden_modules = ["latte_graph_redis.interface"]
